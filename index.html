<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuga Policial</title>
<style>
:root{box-sizing:border-box;color-scheme:dark;--bg:#0b0e14;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;outline:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<script>
// ===== Medidas =====
// A pista tem sempre 360 de largura. O canvas ocupa a tela INTEIRA; a pista fica no centro
// e, em telas largas, as laterais mostram o cenário.
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const W = 360, LANES = 4, LW = W / LANES, CS = 0.9;
const LANE_SPEED = [160, 210, 180, 230];
const SIDE = 44;   // cenário que sempre aparece de cada lado da pista (até no celular)
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let H = 760, Wv = 360, OX = 0, POL_Y = 640, BTN_Y = 705, SC = 1;

function resize() {
  const bw = document.body.clientWidth, bh = document.body.clientHeight;
  SC = Math.min(bw / (W + 2 * SIDE), bh / 760);
  Wv = bw / SC; H = bh / SC; OX = (Wv - W) / 2;
  const d = window.devicePixelRatio || 1;
  cv.style.width = bw + 'px'; cv.style.height = bh + 'px';
  cv.width = Math.round(bw * d); cv.height = Math.round(bh * d);
  ctx.setTransform(SC * d, 0, 0, SC * d, OX * SC * d, 0);
  POL_Y = H - 120; BTN_Y = H - 55;
}
window.addEventListener('resize', resize);
resize();
const laneX = l => l * LW + LW / 2;

// ===== Estado =====
let st = 'menu';   // menu, play, won, over
let fase = 1, g;

function newGame() {
  g = { pLane: 1, px: laneX(1), lives: 3, inv: 0, slow: 0,
        bLane: 2, bx: laneX(2), gap: 190, by: POL_Y - 190, bTimer: 1.5,
        bvx: 0, brot: 0, bInv: 0, bSlow: 0, msg: 0,
        surge: 0, nextSurge: 8, traffic: [], spawn: 0.5, cap: 0, far: 0,
        off: 0, sc: 0, t: 0, reason: '', endT: 0 };
}
newGame();

// ===== Controles =====
function move(d) { if (st === 'play') g.pLane = clamp(g.pLane + d, 0, LANES - 1); }
function advance() {
  if (st === 'menu' || st === 'over') { if (st === 'over') fase = 1; newGame(); st = 'play'; }
  else if (st === 'won' && g.endT > 0.6) { fase++; newGame(); st = 'play'; }
}
const btn = l => ({ x: l ? 250 : 10, y: BTN_Y, w: 100, h: 45 });
const WBTN = { x: W / 2 - 135, y: 235, w: 270, h: 54 };   // botão da tela "Fugitivo Capturado"
const inBtn = (b, x, y) => x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h;
let dragX = null;
function pos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / SC - OX, (e.clientY - r.top) / SC]; }

cv.addEventListener('pointerdown', e => {
  window.focus(); cv.focus();
  const [x, y] = pos(e);
  if (st === 'won') { if (inBtn(WBTN, x, y)) advance(); return; }
  if (st !== 'play') { advance(); return; }
  if (inBtn(btn(0), x, y)) move(-1);
  else if (inBtn(btn(1), x, y)) move(1);
  else dragX = x;
});
cv.addEventListener('pointermove', e => {
  if (dragX === null) return;
  const [x] = pos(e);
  if (Math.abs(x - dragX) > 35) { move(x > dragX ? 1 : -1); dragX = x; }
});
window.addEventListener('pointerup', () => dragX = null);
window.addEventListener('keydown', e => {
  if (e.repeat) return;
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') move(-1);
  else if (k === 'arrowright' || k === 'd') move(1);
  else if (k === 'enter' || k === ' ') advance();
  else return;
  e.preventDefault();
}, true);
window.focus(); cv.focus();

// ===== Lógica =====
function spawnCar() {
  const lane = Math.floor(Math.random() * LANES);
  if (g.traffic.some(c => c.lane === lane && c.y < 150)) return;
  const busy = new Set(g.traffic.filter(c => c.y < 220 && !c.hit).map(c => c.lane));
  busy.add(lane);
  if (busy.size >= LANES) return;
  const cores = ['#d62828', '#f4c20d', '#2e9e4f', '#b8bec7'];
  g.traffic.push({ lane, x: laneX(lane), y: -60, v: LANE_SPEED[lane], rot: 0, vx: 0, vr: 0, hit: false,
                   col: cores[Math.floor(Math.random() * 4)] });
}

// Faixa segura para o fugitivo = sem carro logo à frente ou ao lado dele
const laneSafe = l => !g.traffic.some(c => !c.hit && c.lane === l && c.y < g.by + 70 && c.y > g.by - 210);
function blackChoose(diff) {
  const opts = [g.bLane - 1, g.bLane, g.bLane + 1].filter(l => l >= 0 && l < LANES && laneSafe(l));
  if (!opts.length) return;
  if (Math.random() < Math.min(0.7, diff * 0.3)) {
    const best = Math.max(...opts.map(l => Math.abs(l - g.pLane)));
    const longe = opts.filter(l => Math.abs(l - g.pLane) === best);
    g.bLane = longe[Math.floor(Math.random() * longe.length)];
  } else g.bLane = opts[Math.floor(Math.random() * opts.length)];
}

function update(dt) {
  g.t += dt;
  const diff = (fase - 1) * 0.6 + Math.min(g.t / 45, 2);   // dificuldade cresce com o tempo e a fase
  const f = g.slow > 0 ? 0.5 : 1;
  if (g.slow > 0) g.slow -= dt;
  if (g.inv > 0) g.inv -= dt;
  if (g.bInv > 0) g.bInv -= dt;
  if (g.bSlow > 0) g.bSlow -= dt;
  if (g.msg > 0) g.msg -= dt;
  const ds = 300 * f * (1 + 0.08 * diff) * dt;   // quanto a pista andou neste instante
  g.off = (g.off + ds) % 80; g.sc += ds;         // sc = distância total (move o cenário)
  g.px += (laneX(g.pLane) - g.px) * Math.min(1, 12 * dt);

  // trânsito
  g.spawn -= dt;
  if (g.spawn <= 0) {
    g.spawn = (0.7 + Math.random() * 0.6) / (1 + 0.3 * diff);
    spawnCar();
    if (diff > 1 && Math.random() < 0.35) spawnCar();
  }
  const tv = f * (1 + 0.12 * diff);
  g.traffic.forEach(c => {
    c.y += c.v * tv * dt;
    if (c.hit) { c.x += c.vx * dt; c.rot += c.vr * dt; c.vx *= Math.max(0, 1 - 1.2 * dt); } // carro batido derrapa e gira
  });
  g.traffic = g.traffic.filter(c => c.y < H + 100 && c.x > -OX - 60 && c.x < W + OX + 60);

  // carro preto
  g.bTimer -= dt;
  if (g.bTimer <= 0 || !laneSafe(g.bLane)) {
    if (g.bTimer <= 0) g.bTimer = (1.2 + Math.random() * 1.5) / (1 + 0.3 * diff);
    blackChoose(diff);
  }
  g.bx += (laneX(g.bLane) - g.bx) * Math.min(1, 8 * dt) + g.bvx * dt;
  g.bx = clamp(g.bx, 22, W - 22);
  g.bvx *= Math.max(0, 1 - 5 * dt);
  g.brot *= Math.max(0, 1 - 3 * dt);
  if (diff > 0.4) {
    g.nextSurge -= dt;
    if (g.nextSurge <= 0) { g.surge = 1.2 + Math.random(); g.nextSurge = (6 + Math.random() * 4) / (1 + 0.3 * diff) + g.surge; }
  }
  if (g.surge > 0) g.surge -= dt;
  const alvo = g.slow > 0 ? 400 : g.bSlow > 0 ? 110 : g.surge > 0 ? 320 : 190;
  g.gap += (alvo - g.gap) * Math.min(1, 2 * dt);
  g.by = POL_Y - g.gap;

  // FÍSICA: o fugitivo bate no trânsito. Ele é empurrado para o lado, gira, perde velocidade
  // (você chega mais perto) e o outro carro derrapa e gira também.
  if (g.bInv <= 0) {
    for (const c of g.traffic) {
      if (!c.hit && Math.abs(c.x - g.bx) < 34 && Math.abs(c.y - g.by) < 62) {
        const d = c.x > g.bx ? -1 : c.x < g.bx ? 1 : (Math.random() < 0.5 ? -1 : 1);
        g.bvx = d * 200; g.brot = d * 0.5; g.bSlow = 1.4; g.bInv = 1.5; g.msg = 1.5;
        g.bLane = clamp(g.bLane + d, 0, LANES - 1); g.bTimer = 1.2;
        c.hit = true; c.vx = -d * 160; c.vr = -d * 3.5; c.v *= 0.7;
        break;
      }
    }
  }

  // captura e fuga
  const dl = Math.abs(g.pLane - g.bLane);
  const rate = (g.gap < 250 && dl <= 1) ? (dl === 0 ? 1 : 0.5) : 0;
  if (rate > 0) { g.cap = Math.min(1, g.cap + rate * dt / (20 + 3 * (fase - 1))); g.far = Math.max(0, g.far - dt); }
  else { g.cap = Math.max(0, g.cap - dt * 0.05); g.far += dt; }
  if (g.cap >= 1) { st = 'won'; g.endT = 0; }
  if (g.far >= 7) { st = 'over'; g.reason = 'O fugitivo escapou!'; g.endT = 0; }

  // batidas do carro de polícia
  if (g.inv <= 0) {
    for (const c of g.traffic) {
      if (!c.hit && Math.abs(c.x - g.px) < 31 && Math.abs(c.y - POL_Y) < 58) {
        g.lives--; g.inv = 2; g.slow = 1.2;
        g.traffic = g.traffic.filter(o => o !== c);
        if (g.lives <= 0) { st = 'over'; g.reason = 'Você ficou sem vidas!'; g.endT = 0; }
        break;
      }
    }
  }
}

// ===== Desenho =====
function rr(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }

// k: 0 = comum, 1 = viatura (luzes), 2 = fugitivo (brilho e contorno); rot = giro em radianos
function car(x, y, col, roof, k, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0); ctx.scale(CS, CS);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; rr(-18, -32, 40, 72, 8); ctx.fill();
  if (k === 2) { ctx.shadowColor = '#ff4040'; ctx.shadowBlur = 14; }
  ctx.fillStyle = col; rr(-20, -36, 40, 72, 8); ctx.fill();
  ctx.shadowBlur = 0;
  if (k === 2) { ctx.strokeStyle = '#8a8f99'; ctx.lineWidth = 1.5; ctx.stroke(); }
  ctx.fillStyle = roof; rr(-15, -18, 30, 34, 6); ctx.fill();
  ctx.fillStyle = 'rgba(170,215,255,.75)'; rr(-13, -21, 26, 9, 3); ctx.fill();
  ctx.fillStyle = '#ffe9a0'; ctx.fillRect(-17, -36, 8, 4); ctx.fillRect(9, -36, 8, 4);
  ctx.fillStyle = '#ff3b3b'; ctx.fillRect(-17, 33, 8, 3); ctx.fillRect(9, 33, 8, 3);
  if (k === 1) {
    const a = Math.floor(g.t * 8) % 2 === 0;
    ctx.fillStyle = a ? '#ff2d2d' : '#2d6bff'; ctx.fillRect(-14, -4, 13, 6);
    ctx.fillStyle = a ? '#2d6bff' : '#ff2d2d'; ctx.fillRect(1, -4, 13, 6);
  }
  ctx.restore();
}

function roadAt(top, h, off) {
  ctx.fillStyle = '#2a2d34'; ctx.fillRect(0, top, W, h);
  ctx.fillStyle = '#e8e8e8';
  for (let i = 1; i < LANES; i++)
    for (let y = top - 80 + off; y < top + h; y += 80) {
      const y0 = Math.max(y, top); ctx.fillRect(i * LW - 2, y0, 4, Math.max(0, Math.min(y + 40, top + h) - y0));
    }
  ctx.fillRect(0, top, 3, h); ctx.fillRect(W - 3, top, 3, h);
}

function txt(s, x, y, size, col, align) {
  ctx.font = 'bold ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = align || 'center'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}

// ===== Cenário dos lados da pista =====
const SL = 130;   // altura de cada quarteirão
const rnd = (n, s, k) => { const x = Math.sin(n * 127.1 + s * 311.7 + k * 74.7) * 43758.5453; return x - Math.floor(x); };
const pick = (a, r) => a[Math.floor(r * a.length) % a.length];

function tree(x, y, r) {
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(x + 3, y + 3, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#1f6b3a'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#2f8f4e'; ctx.beginPath(); ctx.arc(x - r * 0.25, y - r * 0.25, r * 0.6, 0, 7); ctx.fill();
}

// Um quarteirão visto de cima. d = -1 (esquerda) ou 1 (direita); u = distância da calçada para fora
function lot(n, s, c, y, d) {
  const edge = d < 0 ? -14 : W + 14, u0 = c * 100;
  const R = (u, v, w, h, col) => { ctx.fillStyle = col; ctx.fillRect(d < 0 ? edge - u - w : edge + u, y + v, w, h); };
  const T = (u, v, r) => tree(d < 0 ? edge - u : edge + u, y + v, r);
  const h = rnd(n, s, c), type = Math.floor(h * 5), j = rnd(n, s, c + 9) * 14;
  if (type === 0 || type === 4) {                      // praça com árvores
    R(u0, 0, 100, SL, '#16301f');
    if (type === 4) R(u0 + 42, 0, 16, SL, '#3a3f4a');
    T(u0 + 22, 22 + j, 16); T(u0 + 70, 68, 18); T(u0 + 24, 108 - j, 14);
  } else if (type === 1) {                             // loja com toldo listrado
    const awn = pick(['#d62828', '#2e9e4f', '#e0a100', '#3a6fd8'], rnd(n, s, c + 3));
    R(u0, 0, 100, SL, '#232838');
    R(u0 + 8, 12, 80, 92, pick(['#4a5368', '#5a4a52', '#3f5a5a'], rnd(n, s, c + 5)));
    for (let k = 0; k < 6; k++) R(u0 + 8, 12 + k * 15.3, 10, 15.3, k % 2 ? '#f2f2f2' : awn);
    R(u0 + 34, 30, 22, 16, '#2d3446'); R(u0 + 60, 62, 16, 16, '#2d3446');
  } else if (type === 2) {                             // prédio alto
    R(u0, 0, 100, SL, '#1d2233');
    R(u0 + 6, 6, 88, 118, '#454e6e'); R(u0 + 12, 12, 76, 106, '#2c3350');
    R(u0 + 22, 24, 18, 18, '#566080'); R(u0 + 54, 70, 22, 22, '#566080');
    if (Math.floor(g.t * 2) % 2) R(u0 + 48, 14, 5, 5, '#ff3b3b');
  } else {                                             // posto de gasolina
    R(u0, 0, 100, SL, '#2b2f3a');
    R(u0 + 6, 18, 46, 74, '#e8c02a'); R(u0 + 6, 18, 46, 9, '#d62828');
    [[16, 38], [16, 64], [34, 38], [34, 64]].forEach(([a, b]) => R(u0 + a, b, 8, 14, '#2a2a2a'));
    R(u0 + 62, 30, 32, 52, '#c9cdd6'); R(u0 + 66, 34, 24, 44, '#e04b3a');
    R(u0 + 2, 104, 4, 4, '#ffdd55');
  }
}

// Desenha os dois lados da pista. sc = distância andada (o cenário rola junto com a pista)
function sides(sc, top) {
  ctx.fillStyle = '#17202f'; ctx.fillRect(-OX, top, OX, H - top); ctx.fillRect(W, top, OX, H - top);
  const cols = Math.max(1, Math.ceil((OX - 14) / 100));
  for (let n = Math.floor((sc - H) / SL) - 1; n <= Math.ceil((sc - top) / SL) + 1; n++) {
    const y = sc - (n + 1) * SL;
    for (let s = 0; s < 2; s++) {
      const d = s ? 1 : -1;
      for (let c = 0; c < cols; c++) lot(n, s, c, y, d);
      ctx.fillStyle = '#3a3f4a'; ctx.fillRect(d < 0 ? -14 : W, y, 14, SL);          // calçada
      const lx = d < 0 ? -7 : W + 7, ly = y + SL / 2;                               // poste de luz
      const gl = ctx.createRadialGradient(lx, ly, 1, lx, ly, 22);
      gl.addColorStop(0, 'rgba(255,220,120,.55)'); gl.addColorStop(1, 'rgba(255,220,120,0)');
      ctx.fillStyle = gl; ctx.fillRect(lx - 22, ly - 22, 44, 44);
      ctx.fillStyle = '#ffe9a0'; ctx.beginPath(); ctx.arc(lx, ly, 2.5, 0, 7); ctx.fill();
    }
  }
}

// Céu do menu: estrelas piscando, lua e prédios ao fundo
function decoSky(base) {
  for (let i = 0; i < 50; i++) {
    const x = ((i * 97) % Math.round(Wv)) - OX, y = (i * 53) % Math.max(60, base - 150);
    ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.4 * Math.sin(g.t * 2 + i)) + ')'; ctx.fillRect(x, y, 2, 2);
  }
  ctx.fillStyle = '#f3efd2'; ctx.beginPath(); ctx.arc(W - 40, 70, 22, 0, 7); ctx.fill();
  ctx.fillStyle = '#e0d9b0'; ctx.beginPath(); ctx.arc(W - 48, 64, 5, 0, 7); ctx.fill();
  for (let i = Math.floor(-OX / 30) - 1; i <= Math.ceil((W + OX) / 30); i++) {
    const n = ((i % 7) + 7) % 7, bh = 90 + ((n * 41) % 70);
    ctx.fillStyle = '#161e42'; ctx.fillRect(i * 30, base - bh, 28, bh);
  }
}

// Efeitos do menu: faixa de sirene no topo, brilho da viatura e faróis
function titleFx(base) {
  for (let i = -Math.ceil(OX / 30) - 1; i < (W + OX) / 30 + 1; i++) {
    ctx.fillStyle = (i + Math.floor(g.t * 6)) % 2 ? 'rgba(255,45,45,.85)' : 'rgba(45,107,255,.85)';
    ctx.fillRect(i * 30, 0, 30, 6);
  }
  const a = Math.floor(g.t * 8) % 2 === 0, x = laneX(2), y = base + 190;
  const gr = ctx.createRadialGradient(x, y, 5, x, y, 130);
  gr.addColorStop(0, a ? 'rgba(255,45,45,.45)' : 'rgba(45,107,255,.45)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = gr; ctx.fillRect(x - 130, y - 130, 260, 260);
  [[base + 70, 110], [base + 190, 120]].forEach(([cy, len]) => {
    const l = ctx.createLinearGradient(0, cy - 34, 0, cy - 34 - len);
    l.addColorStop(0, 'rgba(255,240,180,.28)'); l.addColorStop(1, 'rgba(255,240,180,0)');
    ctx.fillStyle = l; ctx.beginPath(); ctx.moveTo(x - 12, cy - 34); ctx.lineTo(x - 45, cy - 34 - len);
    ctx.lineTo(x + 45, cy - 34 - len); ctx.lineTo(x + 12, cy - 34); ctx.fill();
  });
}

// Fundo das telas de abertura e de captura: céu, prédios e pista, ocupando a tela toda
function backdrop() {
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#090d20'); gr.addColorStop(1, '#27345e');
  ctx.fillStyle = gr; ctx.fillRect(-OX, 0, Wv, H);
  const base = H - 280;
  decoSky(base);
  for (let i = Math.floor(-OX / 40) - 1; i <= Math.ceil((W + OX) / 40); i++) {
    const n = ((i % 9) + 9) % 9, bh = 50 + ((n * 67) % 60);
    ctx.fillStyle = '#0f1630'; ctx.fillRect(i * 40, base - bh, 38, bh);
    for (let k = 0; k < bh / 16 - 1; k++) for (let j = 0; j < 2; j++) {
      ctx.fillStyle = ((n + k * 3 + j) % 3 === 0) ? '#ffd86b' : '#1b2650';
      ctx.fillRect(i * 40 + 7 + j * 15, base - bh + 8 + k * 16, 8, 8);
    }
  }
  ctx.fillStyle = '#17202f'; ctx.fillRect(-OX, base, Wv, H - base);
  ctx.save(); ctx.beginPath(); ctx.rect(-OX, base, Wv, H - base); ctx.clip();
  sides(g.t * 120, base); ctx.restore();
  roadAt(base, H - base, (g.t * 120) % 80);
  return base;
}

function bigButton(b, label, size) {
  const p = 1 + Math.sin(g.t * 4) * 0.04;
  ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(p, p);
  ctx.fillStyle = '#35d07f'; rr(-b.w / 2, -b.h / 2, b.w, b.h, 14); ctx.fill();
  txt(label, 0, size * 0.35, size, '#08210f'); ctx.restore();
}

function drawTitle() {
  const base = backdrop();
  titleFx(base);
  car(laneX(2), base + 70, '#111318', '#000', 2);
  car(laneX(2), base + 190, '#f4f6fa', '#1f4fd8', 1);
  ctx.shadowColor = Math.floor(g.t * 3) % 2 ? '#ff4d6d' : '#4da3ff'; ctx.shadowBlur = 18;
  txt('FUGA', W / 2, 115, 66, '#ffffff');
  txt('POLICIAL', W / 2, 175, 46, Math.floor(g.t * 3) % 2 ? '#ff4d6d' : '#4da3ff');
  ctx.shadowBlur = 0;
  txt('Persiga o carro preto pela avenida', W / 2, 210, 15, '#cfd6e4');
  bigButton({ x: W / 2 - 100, y: 235, w: 200, h: 54 }, 'JOGAR', 26);
  txt('Celular: arraste o dedo ou use ◀ ▶', W / 2, 318, 14, '#9aa3b5');
  txt('Computador: setas ← → ou A / D', W / 2, 340, 14, '#9aa3b5');
  txt('Toque ou Enter para começar', W / 2, 362, 14, '#9aa3b5');
}

function drawWon() {
  const base = backdrop();
  car(laneX(2), base + 80, '#111318', '#000', 2, 0.25);   // fugitivo parado, torto
  car(laneX(2), base + 190, '#f4f6fa', '#1f4fd8', 1);
  txt('FUGITIVO', W / 2, 115, 56, '#ffffff');
  txt('CAPTURADO', W / 2, 175, 44, '#35d07f');
  txt('Fase ' + fase + ' concluída. Muito bem!', W / 2, 210, 15, '#cfd6e4');
  bigButton(WBTN, 'INICIAR FUGA NOVAMENTE', 17);
}

function drawHud() {
  txt('CAPTURA', 20, 14, 11, '#cfd6e4', 'left');
  ctx.fillStyle = 'rgba(0,0,0,.55)'; rr(20, 18, 320, 14, 7); ctx.fill();
  ctx.fillStyle = '#35d07f'; if (g.cap > 0) { rr(20, 18, Math.max(14, 320 * g.cap), 14, 7); ctx.fill(); }
  txt('♥'.repeat(g.lives), 20, 62, 22, '#ff4d6d', 'left');
  txt('Fase ' + fase, 340, 60, 16, '#cfd6e4', 'right');
  if (st === 'play' && g.far > 1) txt('Ele está fugindo! ' + Math.ceil(7 - g.far), W / 2, 100, 18, '#ff6b6b');
  else if (st === 'play' && g.msg > 0) txt('O fugitivo bateu!', W / 2, 100, 18, '#ffd86b');
  [[btn(0), '◀'], [btn(1), '▶']].forEach(([b, s]) => {
    ctx.fillStyle = 'rgba(255,255,255,.14)'; rr(b.x, b.y, b.w, b.h, 12); ctx.fill();
    txt(s, b.x + b.w / 2, b.y + 31, 24, 'rgba(255,255,255,.8)');
  });
}

function drawGame() {
  sides(g.sc, 0);
  roadAt(0, H, g.off);
  g.traffic.forEach(c => car(c.x, c.y, c.col, 'rgba(0,0,0,.28)', 0, c.rot));
  car(g.bx, g.by, '#111318', '#000', 2, g.brot);
  if (!(g.inv > 0 && Math.floor(g.t * 10) % 2)) car(g.px, POL_Y, '#f4f6fa', '#1f4fd8', 1);
  drawHud();
  if (st === 'over') {
    ctx.fillStyle = 'rgba(5,8,14,.72)'; ctx.fillRect(-OX, 0, Wv, H);
    txt('Fim de jogo', W / 2, H / 2 - 70, 34, '#ffffff');
    txt(g.reason, W / 2, H / 2 - 28, 17, '#cfd6e4');
    txt('Toque para jogar de novo', W / 2, H / 2 + 30, 19, '#35d07f');
  }
}

function draw() {
  ctx.fillStyle = '#0b0e14'; ctx.fillRect(-OX, 0, Wv, H);
  if (st === 'menu') drawTitle();
  else if (st === 'won') drawWon();
  else drawGame();
}

// ===== Laço principal =====
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (st === 'play') update(dt);
  else { g.t += dt; if (st !== 'menu') g.endT += dt; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
